[pytest]
asyncio_mode = auto

markers =
    integration: real-server integration tests (spawns a live uvicorn subprocess, slower, excluded from the default run)

# Default run excludes the slower real-server integration tests.
# Run them explicitly with: pytest -m integration
addopts = -m "not integration"

filterwarnings =
    # Starlette/httpx deprecation — tracked, not actionable until httpx2 is stable
    ignore::DeprecationWarning:starlette.*
    # ignore the stale httpx warning from testclient
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
