  { cat: 'interview', q: 'Tell me about a time you found a problem with your own earlier work.',
    a: `Three packages — python-jose, bcrypt, slowapi — were imported unconditionally in production auth and rate-limiting code, but never appeared in requirements.txt. It worked invisibly the whole build because the development sandbox already had them installed from earlier ad-hoc pip installs. I found this by writing a short AST script that walks every backend file, collects every top-level import name, and diffs that against what requirements.txt actually declares — rather than waiting to discover it the hard way on a clean machine. slowapi specifically was the worst of the three: it's imported at the very top of main.py, so a clean install would crash on the first uvicorn startup, before the app object even exists.`,
    ref: 'backend/requirements.txt' },

  { cat: 'interview', q: 'How would you design an ML platform from scratch — what are the core layers?',
    a: `I'd describe it as five layers that should be loosely coupled: ingestion (a common contract every data source implements, so training never cares whether data came from a CSV or BigQuery), profiling (catch leakage and quality issues before they waste a training run, not after), training and explainability (the actual modelling, plus SHAP so predictions aren't a black box), deployment (a standardised packaging step — Docker, health checks, a stable inference endpoint), and the layer most designs skip: monitoring and automated response, because a model that's correct on day one and silently wrong by month three is the actual failure mode that matters in production. I built that fifth layer as a scheduled drift-check-then-retrain-then-promote pipeline.`,
    ref: 'docs/DOCUMENTATION.md §2 — The Big Picture' },

  { cat: 'interview', q: 'How do you handle model staleness or drift in a production ML system?',
    a: `Detection first: compare the current data's distribution against the training baseline using PSI and KS tests for numeric features, chi-squared for categorical — each gets a severity rating, not just a binary alarm. Then a policy-driven response: if drift crosses a configured severity threshold, automatically retrain on the current data; if the new model beats the existing production model by a configured margin, promote it and archive the old one, updating the drift baseline to the new model's training data so the next check compares against what's actually live now, not a stale reference. The key design point is that retraining is gated on detected drift, not run blindly on a calendar — and promotion is gated on the new model actually being better, not just newer.`,
    ref: 'retraining/pipeline.py' },

  { cat: 'interview', q: 'How would you reduce LLM API costs at scale?',
    a: `Four things, in the order I'd actually apply them: pick the cheapest model that meets the quality bar for each specific task (Haiku for agent tool-routing decisions, reserving a larger model only where reasoning quality genuinely matters); let users bring their own API key so cost and rate limits are attributed per-user instead of one shared account absorbing everyone's usage; build a genuine mock mode for every expensive call so development and CI never burn real API budget; and cache anything deterministic and repeatable, like profiling results keyed on content hash, so the same question asked twice doesn't trigger the same expensive computation twice.`,
    ref: 'auth/key_manager.py, caching/cache.py' },

  { cat: 'interview', q: 'What\'s the biggest limitation of what you built, and what would you do next?',
    a: `Honestly: it runs on SQLite with a single worker process, which is the right choice for a portfolio-scale demo but is a real ceiling — concurrent writes, the retraining scheduler, and the in-memory job queue all assume one process. Moving to PostgreSQL plus a distributed lock for the scheduler would be the first production-readiness change. Second: the agent benchmark currently measures a Claude-backed agent as the baseline, not a genuinely loaded, locally-running fine-tuned model, because that needs real GPU infrastructure this environment doesn't have — the pipeline to get there (trace capture, DPO conversion, LoRA training, .crucible export) is fully built and tested, but I haven't closed that last loop end-to-end with a real local inference backend yet.`,
    ref: 'retraining/scheduler.py, agents/benchmark.py' },

  { cat: 'interview', q: 'Why build your own provider abstractions instead of just calling each SDK directly?',
    a: `Because provider choice is an organisational decision a platform shouldn't make on someone else's behalf. A team that already has Postgres-backed MLflow running shouldn't be forced onto Weights & Biases just because that's what the code happens to call directly, and a team with an existing AWS Bedrock contract shouldn't have to route everything through a direct Anthropic key. I applied the same abstraction shape four times — storage, LLM backend, job queue, tracking — specifically so swapping a provider is a one-line config change, not a rewrite of every call site that touches it.`,
    ref: 'storage/base.py, llm/base.py, jobs/queue.py, tracking/base.py' },

  { cat: 'interview', q: 'How do you decide what to unit test versus integration test?',
    a: `Unit/in-process tests (FastAPI's TestClient, in this project) for business logic — they're fast, so you can have a thousand of them and still run the suite in under three minutes. Real-server integration tests are reserved for the specific things an in-process client structurally cannot catch: I found that slowapi's rate limiter reads the real client IP from the ASGI connection, which TestClient always fakes as the literal string "testclient" — a rate-limiting bug that only shows up with genuinely different client IPs would be invisible no matter how many in-process tests you wrote. The rule I used: if the bug class depends on something only a real socket provides — real multipart encoding, a real WebSocket handshake, real connection metadata — it goes in the small, slower, separate integration suite.`,
    ref: 'tests/test_integration_real_server.py' },

  { cat: 'interview', q: 'What\'s a trade-off you made that you\'re not fully happy with?',
    a: `The Experiment table's tracking-run field is still called mlflow_run_id even after I built a provider-agnostic tracking abstraction supporting both MLflow and Weights & Biases — it now holds whichever provider's run ID was returned, not necessarily MLflow's. Renaming it properly would mean a database migration, a schema change, and touching every place the frontend displays it, for a purely cosmetic improvement. I documented the decision directly in the code rather than silently leaving it confusing, but it's a real, acknowledged compromise between correctness-of-naming and not expanding scope for its own sake.`,
    ref: 'training/runner.py (mlflow_run_id field, documented inline)' },

  { cat: 'interview', q: 'If this had real users tomorrow, what\'s the first thing you\'d fix?',
    a: `Move off SQLite to PostgreSQL — it's the single assumption that constrains the most other things at once: single-worker-process, the in-memory job queue's lack of restart-survival, and the retraining scheduler's single-process requirement would all either go away or become much easier to solve properly with a real multi-writer database underneath. Almost everything else in the platform was built provider-agnostic specifically so that kind of infrastructure swap doesn't ripple through the rest of the codebase.`,
    ref: '.env.example (DATABASE_URL — already supports Postgres via asyncpg)' },

  { cat: 'interview', q: 'Walk me through how you\'d explain this system\'s reliability to a non-technical interviewer.',
    a: `Every change goes through 1,024 automated checks before it's considered done, plus a separate set of tests that actually start a real server and talk to it over the network the way a real user would, specifically because some bugs only show up that way. Nothing expensive or requiring special access — cloud training jobs, paid AI calls — has to be tested against the real thing; every one of them has a documented way to simulate realistic behaviour, which is also what makes the whole platform runnable by someone with no AWS account or GPU. And when something does go wrong in production, every request gets a unique ID that shows up in every log line it touches, so tracing a specific failure back to its cause doesn't mean guessing from timestamps.`,
    ref: 'main.py (RequestIDMiddleware), docs/DOCUMENTATION.md §12' },
];

// ════════════════════════════════════════════════════════════════════════
// APPLICATION LOGIC
// ════════════════════════════════════════════════════════════════════════

let activeCategory = 'python';
let searchTerm = '';
let chatHistory = [];

function counts() {
  const c = {};
  CATEGORIES.forEach(cat => { c[cat.id] = QA.filter(item => item.cat === cat.id).length; });
  return c;
}

function renderSidebar() {
  const c = counts();
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = CATEGORIES.map(cat => `
    <div class="nav-item ${activeCategory === cat.id ? 'active' : ''}" data-cat="${cat.id}">
      <span>${cat.label}</span>
      ${cat.special ? '' : `<span class="count">${c[cat.id]}</span>`}
    </div>
  `).join('');

  sidebar.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => {
      activeCategory = el.dataset.cat;
      searchTerm = '';
      document.getElementById('search').value = '';
      renderSidebar();
      renderMain();
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function highlightMatch(text, term) {
  if (!term) return text;
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'ig'), '<mark style="background:rgba(255,122,61,0.3);color:inherit;border-radius:2px;">$1</mark>');
}

function renderMain() {
  const main = document.getElementById('main');
  const cat = CATEGORIES.find(c => c.id === activeCategory);

  if (cat.special) {
    renderChatPanel(main);
    return;
  }

  let items = QA.filter(item => item.cat === activeCategory);
  if (searchTerm) {
    const term = searchTerm.toLowerCase();
    items = QA.filter(item =>
      item.q.toLowerCase().includes(term) || item.a.toLowerCase().includes(term)
    );
  }

  const heading = searchTerm
    ? `Search results for "${escapeHtml(searchTerm)}"`
    : cat.label;
  const sub = searchTerm
    ? `${items.length} match${items.length === 1 ? '' : 'es'} across all categories`
    : categorySubtitle(cat.id);

  main.innerHTML = `
    <h2 class="section-intro">${heading}</h2>
    <p class="section-sub">${sub}</p>
    <div id="qa-list"></div>
  `;

  const list = document.getElementById('qa-list');
  if (items.length === 0) {
    list.innerHTML = '<div class="no-results">No matches. Try a different search term, or ask it directly in "Ask Anything."</div>';
    return;
  }

  list.innerHTML = items.map((item, i) => `
    <div class="qa-item" data-idx="${i}">
      <div class="qa-q">
        <span class="chevron">›</span>
        <span>${searchTerm ? highlightMatch(item.q, searchTerm) : item.q}</span>
      </div>
      <div class="qa-a">
        ${item.a}
        <div class="file-ref">↳ ${item.ref}</div>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.qa-item').forEach(el => {
    el.querySelector('.qa-q').addEventListener('click', () => {
      el.classList.toggle('open');
    });
  });
}

function categorySubtitle(catId) {
  const subs = {
    python: 'Language features this codebase relies on, explained against real call sites — not abstract syntax examples.',
    docker: 'Containerisation and CI/CD concepts, tied to the actual Dockerfile and GitHub Actions workflows in this repo.',
    ml: 'The machine learning theory behind every algorithm and technique Crucible actually uses, in plain language.',
    math: 'The linear algebra and statistics underneath the ML — what a vector, a rank, a p-value, or a KS test actually means, tied to where each one shows up in this codebase.',
    deploy: 'Getting a trained model — or the whole platform — actually running somewhere real: containers, Kubernetes, load balancers, and the three deployment paths this project actually documents.',
    libs: 'What each major library does, and why it was chosen over the obvious alternatives.',
    arch: "Crucible-specific architecture decisions — the recurring patterns, and the reasoning behind each one.",
    interview: 'Real moments from building this project — actual bugs, actual trade-offs, actual design reasoning — packaged as direct, ready answers for the questions interviewers actually ask.',
  };
  return subs[catId] || '';
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  renderMain();
});

// ── Ask Anything — live chat wired to Claude ──────────────────────────────

const SUGGESTIONS = [
  'Why does Crucible use SHAP instead of just feature_importances_?',
  'Explain async/await like I\'ve never seen it before.',
  'What would break if I removed the multi-stage Docker build?',
  'How is DPO different from regular fine-tuning?',
];

function renderChatPanel(main) {
  main.innerHTML = `
    <h2 class="section-intro">Ask Anything</h2>
    <p class="section-sub">Beyond the curated reference — ask about Python, Docker, ML theory, or anything else in this codebase. Answered live by Claude.</p>
    <div class="suggestion-chips" id="chips"></div>
    <div id="chat-error-slot"></div>
    <div class="chat-panel">
      <div class="chat-log" id="chat-log">
        <div class="chat-empty">No messages yet. Ask a question, or pick a suggestion above.</div>
      </div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="1" placeholder="Ask about Python, Docker, ML, this codebase…"></textarea>
        <button id="chat-send">Ask</button>
      </div>
    </div>
  `;

  document.getElementById('chips').innerHTML = SUGGESTIONS.map(s =>
    `<div class="chip" data-q="${escapeHtml(s)}">${s}</div>`
  ).join('');
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.getElementById('chat-input').value = chip.dataset.q;
      sendChat();
    });
  });

  renderChatLog();

  document.getElementById('chat-send').addEventListener('click', sendChat);
  document.getElementById('chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
  });
}

function renderChatLog() {
  const log = document.getElementById('chat-log');
  if (!log) return;
  if (chatHistory.length === 0) {
    log.innerHTML = '<div class="chat-empty">No messages yet. Ask a question, or pick a suggestion above.</div>';
    return;
  }
  log.innerHTML = chatHistory.map(msg => `
    <div class="msg ${msg.role}">
      <div class="msg-avatar">${msg.role === 'user' ? 'Y' : 'C'}</div>
      <div class="msg-bubble">${msg.pending ? '<span class="typing-dots"><span></span><span></span><span></span></span>' : escapeHtml(msg.content)}</div>
    </div>
  `).join('');
  log.scrollTop = log.scrollHeight;
}

const SYSTEM_PROMPT = `You are answering questions inside Crucible's interactive theory & reference page. Crucible is an ML experimentation platform with: AutoML training (9 model families, Optuna+Hyperband, probability calibration), SHAP explainability, fairness metrics, drift/anomaly detection, a RAG pipeline, ReAct and LangGraph multi-agent systems, an agent training pipeline (capture traces → SFT/DPO → .crucible bundles), LoRA/DPO fine-tuning, a scheduled retraining pipeline (drift → retrain → promote), SageMaker/Bedrock/multi-cloud integration, and MLflow/W&B tracking. It's built with FastAPI, async SQLAlchemy, React, and Docker.

Answer questions about Python, Docker, machine learning theory, or this project's specific architecture clearly and concisely, the way a patient senior engineer would explain it to someone learning. Prefer plain language over jargon; when you must use a technical term, briefly define it. Keep answers focused — a few sentences to a short paragraph, not an essay, unless the question genuinely needs more. If asked something with no connection to Python/Docker/ML/this project, answer it anyway, just keep the same clear, concise style.`;

async function sendChat() {
  const input = document.getElementById('chat-input');
  const question = input.value.trim();
  if (!question) return;

  document.getElementById('chat-error-slot').innerHTML = '';
  input.value = '';
  chatHistory.push({ role: 'user', content: question });
  chatHistory.push({ role: 'assistant', content: '', pending: true });
  renderChatLog();

  const sendBtn = document.getElementById('chat-send');
  sendBtn.disabled = true;

  try {
    const apiMessages = chatHistory
      .filter(m => !m.pending)
      .map(m => ({ role: m.role, content: m.content }));

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: apiMessages,
      }),
    });

    const data = await response.json();
    const text = (data.content || [])
      .map(block => block.type === 'text' ? block.text : '')
      .filter(Boolean)
      .join('\n');

    chatHistory[chatHistory.length - 1] = {
      role: 'assistant',
      content: text || 'No response received — try rephrasing the question.',
    };
  } catch (err) {
    chatHistory.pop();
    document.getElementById('chat-error-slot').innerHTML =
      `<div class="chat-error">Couldn't reach Claude right now. ${escapeHtml(String(err && err.message || err))}</div>`;
  }

  sendBtn.disabled = false;
  renderChatLog();
}
