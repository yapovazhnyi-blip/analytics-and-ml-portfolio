name: Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel in-progress runs for the same branch/PR when a new push arrives.
# This avoids wasting CI minutes on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false        # run all matrix variants even if one fails
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ───────────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── Dependency cache ─────────────────────────────────────────────────
      # Key includes the requirements hash so the cache is invalidated when
      # any dependency changes. Cache hit reduces pip install from ~4min to ~10s.
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      # ── Install ───────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov coverage[toml]

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Run tests with coverage
        env:
          # Use in-memory SQLite for all tests — no file-system DB needed
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          # Disable real API calls in tests
          DISABLE_AUTH: "true"
          ANTHROPIC_API_KEY: ""          # tests mock the Anthropic API
          STORAGE_BACKEND: "local"
          STORAGE_LOCAL_ROOT: "/tmp/crucible-test-storage"
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -q \
            --tb=short \
            -x

      # ── Coverage report ───────────────────────────────────────────────────
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'   # upload once, not twice
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          name: crucible-backend
          fail_ci_if_error: false            # don't fail CI on Codecov issues
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # ── Test summary ──────────────────────────────────────────────────────
      - name: Test summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            core.summary
              .addHeading('Test Results')
              .addRaw(`Python ${{ matrix.python-version }}`)
              .write()

  # ── Real integration tests (separate job — spawns live uvicorn subprocess) ──
  integration:
    name: Integration tests (live server)
    runs-on: ubuntu-latest
    needs: test     # only run if the fast unit/TestClient suite already passed

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run real-server integration tests
        env:
          ANTHROPIC_API_KEY: ""
        run: |
          pytest tests/test_integration_real_server.py -m integration -v --tb=short
