# Render Blueprint — deploys Crucible with one click.
# Usage: connect this repo at https://dashboard.render.com/blueprints
#
# Render is the fastest path to a public URL for portfolio/demo purposes.
# It is NOT what you'd use in production at scale (see infra/ecs/ for that),
# but it requires zero AWS account setup and has a free tier.

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: crucible-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                      # upgrade to "starter" for always-on (free tier sleeps after 15min idle)
    region: oregon
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crucible-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true         # Render auto-generates a secure random value
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /app/data/storage
      - key: DISABLE_AUTH
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false                 # set manually in Render dashboard — never commit secrets
      - key: LLM_PROVIDER
        value: anthropic
      - key: CORS_ORIGINS
        value: https://crucible-frontend.onrender.com

  # ── Frontend (static site) ──────────────────────────────────────────────
  - type: web
    name: crucible-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://crucible-backend.onrender.com/api/v1
    routes:
      - type: rewrite               # SPA fallback — all routes serve index.html
        source: /*
        destination: /index.html

databases:
  - name: crucible-db
    plan: free                      # 1GB free Postgres, 90-day retention
    region: oregon
